<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">

  <!-- Background (transparent) -->
  
  <!-- Robot Head -->
  <circle cx="100" cy="100" r="60" fill="#E5E7EB" stroke="#1F2937" stroke-width="4"/>
  
  <!-- Eye -->
  <ellipse cx="120" cy="95" rx="8" ry="5" fill="#22C55E"/>
  
  <!-- Circuit Lines -->
  <line x1="70" y1="80" x2="100" y2="60" stroke="#2563EB" stroke-width="3"/>
  <circle cx="70" cy="80" r="4" fill="#2563EB"/>
  <circle cx="100" cy="60" r="4" fill="#2563EB"/>

  <line x1="60" y1="100" x2="90" y2="100" stroke="#2563EB" stroke-width="3"/>
  <circle cx="60" cy="100" r="4" fill="#2563EB"/>

  <line x1="75" y1="120" x2="105" y2="140" stroke="#2563EB" stroke-width="3"/>
  <circle cx="105" cy="140" r="4" fill="#2563EB"/>

  <!-- Book Base -->
  <path d="M60 150 Q100 130 140 150 L140 165 Q100 145 60 165 Z"
        fill="#F3F4F6" stroke="#1F2937" stroke-width="3"/>

  <!-- Circuit on Book -->
  <line x1="85" y1="150" x2="115" y2="150" stroke="#22C55E" stroke-width="3"/>
  <circle cx="85" cy="150" r="3" fill="#22C55E"/>
  <circle cx="115" cy="150" r="3" fill="#22C55E"/>

  <!-- Text -->
  <text x="200" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2563EB">
    PHYSICAL AI
  </text>

  <text x="200" y="135" font-family="Arial, sans-serif" font-size="22" letter-spacing="4" fill="#374151">
    TEXTBOOK
  </text>

</svg>
